<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">DecoStone MMS Context DFD, Level 0</title><desc id="desc">Admin, Manager and Supervisor use DecoStone MMS to submit inventory and account requests and receive results and reports.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker><style>text{font-family:Arial,sans-serif;fill:#162235}.h{font-size:30px;font-weight:bold}.sub{font-size:17px;fill:#526078}.box{fill:#eef4fb;stroke:#405d7a;stroke-width:2}.proc{fill:#fff3df;stroke:#9c570c;stroke-width:3}.name{font-size:21px;font-weight:bold}.small{font-size:15px;fill:#475569}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#a)}.label{font-size:15px;font-weight:bold;fill:#334155}</style></defs>
<rect width="1400" height="520" rx="16" fill="#fff"/>
<text x="700" y="48" text-anchor="middle" class="h">Data Flow Diagram — Level 0</text><text x="700" y="77" text-anchor="middle" class="sub">Context diagram for DecoStone Material Management System (MMS)</text>
<rect x="85" y="190" width="310" height="150" rx="10" class="box"/><text x="240" y="230" text-anchor="middle" class="name">System users</text><text x="240" y="265" text-anchor="middle" class="small">Admin · Manager · Supervisor</text><text x="240" y="292" text-anchor="middle" class="small">Supervisor access is limited to</text><text x="240" y="315" text-anchor="middle" class="small">assigned godowns</text>
<ellipse cx="930" cy="265" rx="280" ry="140" class="proc"/><text x="930" y="239" text-anchor="middle" class="name">0. DecoStone MMS</text><text x="930" y="273" text-anchor="middle" class="small">Validates user access and permissions</text><text x="930" y="299" text-anchor="middle" class="small">Processes materials and stock activity</text><text x="930" y="325" text-anchor="middle" class="small">Provides balances, alerts and reports</text>
<path d="M395 225 C520 155 675 155 700 220" class="line"/><text x="548" y="158" text-anchor="middle" class="label">Credentials, master-data changes, stock actions</text><text x="548" y="180" text-anchor="middle" class="label">and information requests</text>
<path d="M700 310 C660 390 500 390 395 300" class="line"/><text x="548" y="385" text-anchor="middle" class="label">Access status, operation results, stock views,</text><text x="548" y="407" text-anchor="middle" class="label">alerts and reports</text>
<text x="700" y="480" text-anchor="middle" class="small">Level 1 expands the system into internal processes and database stores.</text>
</svg>
